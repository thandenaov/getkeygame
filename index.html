<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f9">
  <title>Get Key Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f3f9;--card:#fff;--text:#101014;--muted:#96959c;--line:#e7e6eb;--soft:#e5e4e9;--accent:#178ee8;--accent2:#5577ff;--shadow:0 12px 32px rgba(35,25,65,.07)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#101116;--card:#1c1d23;--text:#fafafa;--muted:#92939a;--line:#303139;--soft:#292a31;--shadow:none}
    button,a{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:48px 28px 90px}.hero{display:grid;grid-template-columns:76px 1fr 58px;align-items:center;gap:20px;max-width:620px;margin:0 auto 48px}.logo{width:76px;height:76px;border-radius:19px;object-fit:cover;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 58%,transparent)}h1{font-size:clamp(27px,5vw,38px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-1px}.theme{width:58px;height:58px;border:0;border-radius:50%;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:27px;cursor:pointer}
    .section{max-width:650px;margin:0 auto 34px}.section-head{display:flex;justify-content:space-between;color:var(--muted);font-size:19px;font-weight:800;margin:0 26px 14px;text-transform:uppercase}.progress{height:9px;border-radius:99px;background:#d8d7dc;overflow:hidden;margin-bottom:20px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s;border-radius:inherit}.task-card{background:var(--card);border-radius:27px;padding-left:28px;box-shadow:var(--shadow);overflow:hidden}.task{min-height:104px;display:grid;grid-template-columns:58px 1fr 25px;gap:22px;align-items:center;text-decoration:none;color:var(--text);border-bottom:1px solid var(--line);padding:16px 28px 16px 0}.task:last-child{border-bottom:0}.task-icon{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px;overflow:hidden;background:#555}.task-icon img{width:100%;height:100%;object-fit:cover}.task-title{font-size:clamp(19px,4vw,27px);font-weight:700;line-height:1.2}.arrow{font-size:40px;color:#b8b8ba}.task.done{opacity:.58}.task.done .arrow{font-size:0}.task.done .arrow:before{content:'✓';font-size:28px;color:#35b66d}
    .unlock-title{color:var(--muted);font-size:20px;font-weight:800;margin:0 25px 16px;text-transform:uppercase}.unlock-list{display:grid;gap:20px}.unlock{width:100%;min-height:84px;border:0;border-radius:23px;background:var(--soft);color:#99989e;font-size:clamp(17px,4vw,25px);font-weight:700;padding:18px;cursor:not-allowed}.unlock.ready{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;box-shadow:0 12px 25px color-mix(in srgb,var(--accent) 28%,transparent)}.guides{max-width:650px;margin:28px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 28px}.guides a{color:var(--accent);text-decoration:none;font-size:clamp(16px,3.8vw,22px);font-weight:700}.guides a:before{content:'▶';display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;margin-right:9px;vertical-align:2px}.toast{position:fixed;left:50%;bottom:30px;translate:-50% 18px;background:#111;color:#fff;padding:13px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.22s;z-index:99;font-weight:600;white-space:nowrap;max-width:90vw}.toast.show{opacity:1;translate:-50% 0}.empty{padding:30px;text-align:center;color:var(--muted);font-weight:700}
    @media(max-width:520px){.page{padding:38px 27px 70px}.hero{grid-template-columns:62px 1fr 52px;gap:17px}.logo{width:62px;height:62px;border-radius:15px}.theme{width:52px;height:52px}.task-card{padding-left:27px}.task{min-height:103px;grid-template-columns:57px 1fr 18px;gap:20px;padding-right:20px}.task-icon{width:57px;height:57px}}
  </style>
</head>
<body>
<main class="page">
  <header class="hero"><img class="logo" id="logo" alt="Logo"><h1 id="title"></h1><button class="theme" id="themeBtn" aria-label="Đổi giao diện">☾</button></header>
  <section class="section"><div class="section-head"><span id="taskHeading">Nhiệm vụ</span><span id="count">0 / 0</span></div><div class="progress"><span id="progress"></span></div><div class="task-card" id="taskList"></div></section>
  <section class="section"><div class="unlock-title" id="unlockHeading">Mở khoá key</div><div class="unlock-list" id="unlockList"></div></section>
  <nav class="guides" id="guides"></nav>
</main><div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
